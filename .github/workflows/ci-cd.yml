# CI/CD del backend de Barbería (rama "deploy")
#   PR hacia deploy  -> tests + SonarCloud
#   push a deploy    -> tests + SonarCloud -> versión (semantic-release) -> deploy en Render
name: CI/CD Backend

on:
  pull_request:
    branches: [deploy]
  push:
    branches: [deploy]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # 1) CALIDAD: compila, corre los tests (con JaCoCo) y analiza en SonarCloud
  calidad:
    name: Tests + SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend      # el proyecto Maven está en la carpeta backend/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                # Sonar necesita el historial completo

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Tests + análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=epilef9_backend
          -Dsonar.organization=epilef9
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # 2) VERSIÓN: crea el tag y el release en GitHub (v1.0.0, v1.0.1...)
  version:
    name: Versión
    needs: calidad
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                # semantic-release lee todos los commits y tags

      - name: Crear versión / release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3) DEPLOY: solo si pasaron los tests y se versionó
  deploy:
    name: Deploy en Render
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
