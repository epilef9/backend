# CI/CD del backend de Barbería (rama "deploy") — 4 jobs, como en la consigna:
#   Test -> SonarQ -> Versión -> Deploy
#   PR hacia deploy  -> Test + SonarQ
#   push a deploy    -> Test + SonarQ -> Versión (semantic-release) -> Deploy en Render
name: CI/CD Backend

on:
  pull_request:
    branches: [deploy]
  push:
    branches: [deploy]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # 1) TEST: compila y corre los tests; JaCoCo genera el reporte de cobertura
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend      # el proyecto Maven está en la carpeta backend/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y testear
        run: mvn -B clean verify

      # Guarda las clases compiladas y el reporte de cobertura para el job de Sonar
      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: build-y-cobertura
          path: |
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco
          retention-days: 1

  # 2) SONARQ: analiza el código y la cobertura en SonarQube Cloud (usa lo que generó Test)
  sonar:
    name: SonarQ
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0                # Sonar necesita el historial completo

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Traer resultados de Test
        uses: actions/download-artifact@v4
        with:
          name: build-y-cobertura
          path: backend/target

      - name: Análisis en SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=epilef9_backend
          -Dsonar.organization=epilef9
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # 3) VERSIÓN: crea el tag y el release en GitHub según los commits (fix: / feat:)
  version:
    name: Versión
    needs: [test, sonar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0                # semantic-release lee todos los commits y tags

      - name: Crear versión / release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4) DEPLOY: solo si pasaron Test, SonarQ y Versión
  deploy:
    name: Deploy
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_MAL }}"
