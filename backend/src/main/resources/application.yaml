spring:
  datasource:
    # En Render se cargan como variables de entorno; los valores después de ":" son los de la PC local
    url: ${DB_URL:jdbc:mysql://localhost:3306/barber_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # Cierra la conexión a la base al terminar cada request (saca el WARN de open-in-view)
    open-in-view: false
    # Sin dialecto fijo: Hibernate lo detecta solo (MySQL local o PostgreSQL/MySQL en la nube)

jwt:
  secret: ${JWT_SECRET:mi-clave-secreta-super-segura-para-jwt-barberia}
  expiration: 86400000

server:
  # Render asigna el puerto en la variable PORT
  port: ${PORT:8080}
